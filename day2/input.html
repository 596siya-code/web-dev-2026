<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>username</label>
    <input placeholder="Enter Your Name "><br><br>

    <!-- input types = abc@xyz.com -->

    <input type="text" placeholder="Username"><br><br>

    <input type="email" placeholder="abc@example.com"><br><br>

    <input type="Password" placeholder="******"><br><br>

    <input type="url" placeholder="https://yoursite.com"><br><br>

    <input type="tel" placeholder="+91 9518287446"><br><br>

    <!-- Date and Time -->
     <input type="date">
     <input type="time">

     <input type="datetime-local">
     <input type="month">
     <input type="week"><br><br>

     <!-- selection box -->
      <input type="checkbox">
      <label>I agree to terms and condition</label><br><br>

      <!-- special input -->
       <input type="file">
       <input type="color">
       <input type="range">
       <input type="number" placeholder="number"><br><br>

    <!-- validation -->
        <input type="text" placeholder="name" required><br><br>
        <input type="text" placeholder="username" minlength="3"  maxlength="10"><br><br>
        <input type="tel" placeholder="phone no." pattern="[0-9] {10}"><br><br>

        <!-- Feedback and Reviews -->

        <textarea cols="15" rows="10"  placeholder="Feedback"></textarea>


</body>
</html>
